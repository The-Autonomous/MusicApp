[package]
name = "rust_musicapp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native Rust MusicApp, with the original Tk rendering engine"
license = "GPL-3.0-only"

[dependencies]
cpal = "0.16"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
url = "2"
libloading = "0.8"
cesu8 = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tiny_http = "0.12"
lofty = "0.22"
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-webpki-roots", "userdata"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

